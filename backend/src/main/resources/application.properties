spring.application.name=event-rent-api
server.port=8080

spring.data.mongodb.uri=mongodb://localhost:27017/event_rental

# JSON: serialize dates as ISO-8601 strings for the React app
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (change secret in production; must be at least 32 characters)
app.jwt.secret=dev-change-me-use-32chars-minimum-secret-key
app.jwt.expiration-ms=86400000

# EMAIL SETTINGS (Secured via Environment Variables)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL for email links
app.frontend.url=http://localhost:5173
